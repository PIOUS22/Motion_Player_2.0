name: Build APK
on:
  push: {tags: ['v*']}
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      # Generates the android/ scaffold (gradle, MainActivity, icons) around our manifest
      - run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/m.xml
          flutter create . --org com.motionplayer --project-name motion_player --platforms android
          cp /tmp/m.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          printf '<?xml version="1.0" encoding="utf-8"?><paths><external-path name="e" path="."/><external-files-path name="f" path="."/></paths>' > android/app/src/main/res/xml/provider_paths.xml
          sed -i 's/minSdkVersion.*/minSdk = 24/;s/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle* || true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: {files: build/app/outputs/flutter-apk/app-release.apk}
      - uses: actions/upload-artifact@v4
        with: {name: motion-player-apk, path: build/app/outputs/flutter-apk/app-release.apk}
